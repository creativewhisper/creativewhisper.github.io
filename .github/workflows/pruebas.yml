name: Pruebas de la web
# En cada PR se prueba la copia del PR servida en local. Después de cada cambio en main, y cada mañana, se prueba
# lo que está publicado en creativewhisper.net. No envía formularios ni publica nada. No usa secretos.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 12 * * *"   # 07:23 de Quito
  workflow_dispatch:
    inputs:
      agentes:
        description: "Preguntar a los agentes (gasta unas respuestas de IA)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency: { group: "pruebas-${{ github.ref }}", cancel-in-progress: true }
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: pruebas } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4 (fijada por SHA en la 11.5)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4 (fijada por SHA en la 11.5)
        with: { node-version: 22 }
      - name: Pruebas del generador de las políticas (Fase 11.6c)
        run: node --test ../.github/politicas/generar.test.mjs
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Esperar a que GitHub Pages publique
        if: github.event_name == 'push'
        run: sleep 150
      - name: "Pruebas (en un PR, la copia local; si no, la web publicada)"
        env:
          EVENTO: ${{ github.event_name }}
          CON_AGENTES: ${{ inputs.agentes && '1' || '' }}
          CI: "1"
        run: |
          if [ "$EVENTO" != "pull_request" ]; then export BASE=https://creativewhisper.net; fi
          echo "Se prueba: ${BASE:-la copia local de este PR}"
          npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4 (fijada por SHA en la 11.5)
        if: failure()
        with:
          name: informe-pruebas
          retention-days: 7
          path: |
            pruebas/informe
            pruebas/resultados
