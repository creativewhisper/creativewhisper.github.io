<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Oficina CW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  /* Colores de las marcas */
  --bataka:#F5A300; --torote:#E3120B; --uinky:#FFD7BD; --porthos:#3EA398; --cw:#0A0908; --cw-2:#CDBFA6;
  --fondo:#0A0908; --tarjeta:#151311; --tarjeta-2:#1E1B18; --texto:#F3EEE6; --suave:#A39A8E; --linea:rgba(243,238,230,.10);
  --f:"Hanken Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--cw-2)}
.oculto{display:none!important}
/* Franja de las marcas, como las barras inclinadas */
.franja{height:calc(8px + var(--safe-t));background:linear-gradient(100deg,var(--bataka) 0 20%,var(--torote) 20% 40%,var(--uinky) 40% 60%,var(--porthos) 60% 80%,var(--cw-2) 80% 100%)}
.app{display:flex;flex-direction:column;height:calc(100dvh - 8px - var(--safe-t));max-width:640px;margin:0 auto}
header{padding:12px 18px;display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:22px;font-weight:700;flex:1;letter-spacing:-.01em}
header .rec{width:38px;height:38px;border-radius:12px;background:var(--tarjeta);display:grid;place-items:center}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 20px}
nav{display:flex;gap:8px;padding:8px 18px calc(10px + var(--safe-b));border-top:1px solid var(--linea)}
nav button{flex:1;padding:12px;border-radius:14px;font-weight:600;font-size:15px;color:var(--suave);background:var(--tarjeta);display:flex;align-items:center;justify-content:center;gap:8px}
nav button.activo{background:var(--cw-2);color:var(--cw)}
nav .num{background:var(--torote);color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center}
/* Tarjetas: una barra del color de la marca a la izquierda */
.vacio{color:var(--suave);padding:28px 4px;text-align:center}
.vacio b{display:block;color:var(--texto);font-size:18px;margin-bottom:4px}
.card{position:relative;background:var(--tarjeta);border-radius:16px;padding:14px 14px 14px 20px;margin-bottom:12px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--color,var(--cw-2))}
.marca{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color,var(--cw-2));display:flex;gap:8px;align-items:center}
.marca .hoy{background:var(--torote);color:#fff;border-radius:6px;padding:1px 7px;letter-spacing:.04em}
.tit{font-size:17px;font-weight:600;line-height:1.3;margin:4px 0}
.sub{color:var(--suave);font-size:14px}
.paso{margin-top:6px;font-size:15px}
.propuesta{margin-top:10px;background:var(--tarjeta-2);border-radius:12px;padding:10px 12px;font-size:15px;white-space:pre-wrap}
.propuesta span{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--suave);margin-bottom:2px}
.card textarea{width:100%;margin-top:12px;min-height:46px;border-radius:12px;border:1px solid var(--linea);background:var(--tarjeta-2);padding:11px 12px;font-size:16px;resize:none}
.card textarea::placeholder{color:#7d756b}
.acciones{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:13px;border-radius:12px;font-weight:700;font-size:15px;background:var(--tarjeta-2);color:var(--texto)}
.btn.pri{background:var(--cw-2);color:var(--cw)}
.btn:disabled{opacity:.5}
details{margin-top:8px} summary{color:var(--suave);font-size:13px;cursor:pointer}
.largo{white-space:pre-wrap;font-size:13px;color:var(--suave);margin-top:6px;max-height:260px;overflow:auto}
.seccion{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--suave);margin:22px 0 6px}
.hecho{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--linea)}
.hecho .punto{width:10px;height:10px;border-radius:50%;background:var(--color,var(--cw-2));margin-top:7px;flex:0 0 auto}
.hecho .t{font-size:15px} .hecho .s{font-size:13px;color:var(--suave)}
/* Chat */
.agentes{display:flex;gap:6px;overflow-x:auto;padding:0 18px 8px;scrollbar-width:none}
.agentes button{flex:0 0 auto;border-radius:999px;padding:6px 12px;font-size:14px;background:var(--tarjeta);color:var(--suave)}
.agentes button.activo{background:var(--texto);color:var(--cw);font-weight:600}
.msgs{display:flex;flex-direction:column;gap:8px}
.burbuja{max-width:86%;padding:10px 13px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.burbuja.yo{align-self:flex-end;background:var(--cw-2);color:var(--cw);border-bottom-right-radius:6px}
.burbuja.ag{align-self:flex-start;background:var(--tarjeta);border-bottom-left-radius:6px}
.burbuja .hora{display:block;font-size:11px;opacity:.55;margin-top:4px}
.pensando{color:var(--suave);font-style:italic}
.atajos{display:flex;gap:6px;overflow-x:auto;padding:4px 18px 0;scrollbar-width:none}
.atajos button{flex:0 0 auto;border-radius:999px;padding:7px 12px;font-size:14px;border:1px solid var(--linea)}
.entrada{display:flex;gap:8px;align-items:flex-end;padding:6px 18px 8px}
.entrada textarea{flex:1;resize:none;max-height:140px;min-height:46px;border-radius:23px;border:0;background:var(--tarjeta);padding:12px 16px;font-size:16px;line-height:1.3}
.entrada button{width:46px;height:46px;border-radius:50%;background:var(--cw-2);color:var(--cw);display:grid;place-items:center;flex:0 0 auto}
.entrada button:disabled{opacity:.4}
/* WhatsApp */
.fila{position:relative;overflow:hidden;display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--tarjeta);border-radius:14px;padding:12px 14px 12px 20px;margin-bottom:8px}
.fila::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--color,var(--cw-2))}
.fila .izq{min-width:0;flex:1}
.fila .n{font-weight:600;font-size:16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fila .u{color:var(--suave);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .der{font-size:12px;color:var(--suave);flex:0 0 auto}
.etq{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;letter-spacing:.03em}
.etq.nec{background:var(--torote);color:#fff} .etq.tu{background:var(--cw-2);color:var(--cw)}
.cab{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cab .volver{width:38px;height:38px;border-radius:12px;background:var(--tarjeta);display:grid;place-items:center;flex:0 0 auto}
.cab .info{flex:1;min-width:0} .cab .info b{display:block;font-size:17px} .cab .info span{font-size:13px;color:var(--suave)}
.cab .btn{flex:0 0 auto;padding:9px 12px;font-size:14px}
.alerta{background:rgba(227,18,11,.12);border:1px solid rgba(227,18,11,.35);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.alerta div{flex:1} .alerta button{font-size:13px;font-weight:700;color:var(--cw-2);flex:0 0 auto}
.nota{color:var(--suave);font-size:13px;text-align:center;margin:6px 0 2px}
.burbuja.bot{align-self:flex-end;background:var(--tarjeta-2);border-bottom-right-radius:6px}
.burbuja .quien{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.6;margin-bottom:2px}
/* Entrar */
.login{max-width:360px;margin:14vh auto 0;padding:0 18px}
.login h1{font-size:26px;margin:0 0 20px}
.login input{width:100%;margin-bottom:10px;border-radius:12px;border:0;background:var(--tarjeta);padding:14px;font-size:16px}
.login .btn{width:100%}
.aviso{color:#FF8A7A;font-size:14px;min-height:18px;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe-b));background:var(--texto);color:var(--cw);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;max-width:90%;z-index:9;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.aj-archivo{margin-top:8px;display:inline-flex}.aj-nom{display:block;font-size:13px;opacity:.75;margin-top:4px}
.comprobante{display:block;margin:10px 0 4px}.comprobante img{width:100%;max-height:320px;object-fit:contain;border-radius:8px;background:#0003}
.btn.enlace{display:inline-block;margin:10px 0 2px;text-decoration:none}
/* Clientes: interruptor de membresía */
.cli .cab2{display:flex;align-items:center;gap:10px}
.cli .cab2 b{font-size:19px;flex:1}
.estado{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:8px;padding:3px 9px}
.estado.on{background:rgba(62,163,152,.18);color:var(--porthos)} .estado.off{background:rgba(227,18,11,.18);color:#FF8A7A}
.interruptor{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:14px;border-radius:14px;background:var(--tarjeta-2);text-align:left}
.interruptor .pista{width:52px;height:30px;border-radius:999px;background:#3a342e;position:relative;flex:0 0 auto;transition:background .2s}
.interruptor .pista::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--texto);transition:transform .2s}
.interruptor.on .pista{background:var(--porthos)} .interruptor.on .pista::after{transform:translateX(22px)}
.interruptor .tx b{display:block;font-size:16px} .interruptor .tx span{font-size:13px;color:var(--suave)}
.datos3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.datos3 div{background:var(--tarjeta-2);border-radius:12px;padding:10px;text-align:center} .datos3 b{display:block;font-size:20px} .datos3 span{font-size:12px;color:var(--suave)}
.fila2{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.fila2 label{font-size:14px;color:var(--suave);flex:1;min-width:140px}
.fila2 input[type=date]{border-radius:10px;border:1px solid var(--linea);background:var(--tarjeta-2);padding:9px 10px;font-size:15px;color:var(--texto)}
.enlaces{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.enlaces a,.enlaces button{display:block;text-align:center;padding:11px 8px;border-radius:12px;background:var(--tarjeta-2);font-weight:700;font-size:14px;text-decoration:none;color:var(--texto)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--suave);margin-top:10px}
/* Fase 2: alta de clientes y lista de estado */
.nuevo input,.nuevo select{width:100%;margin-top:8px;border-radius:12px;border:1px solid var(--linea);background:var(--tarjeta-2);padding:11px 12px;font-size:16px;color:var(--texto)}
.enlace-alta{margin-top:10px;background:var(--tarjeta-2);border-radius:12px;padding:10px 12px;font-size:13px;word-break:break-all}
.enlace-alta .qr{background:#fff;border-radius:10px;padding:8px;width:max-content;margin:8px auto 0}
.lista-estado{margin-top:10px;font-size:14px;line-height:1.5}
.lista-estado .ok{color:var(--porthos)} .lista-estado .no{color:var(--bataka)} .lista-estado .apag{color:var(--suave)}

/* Fase 4 · Tablero de salud, uso por plan, enlaces del panel y privacidad (paleta de CW) */
.salud-n{display:inline-block;border-radius:8px;padding:2px 9px;font-size:12px;font-weight:800;letter-spacing:.03em;margin-left:6px}
.salud-n.ok{background:rgba(62,163,152,.18);color:var(--porthos)} .salud-n.aviso{background:rgba(245,163,0,.18);color:var(--bataka)} .salud-n.alerta{background:var(--torote);color:#fff}
.alerta-fila{border-left:3px solid var(--linea);padding:6px 0 6px 10px;margin-top:8px;font-size:14px}
.alerta-fila.alerta{border-color:var(--torote)} .alerta-fila.aviso{border-color:var(--bataka)}
.alerta-fila b{display:block} .alerta-fila span{color:var(--suave)}
.salud-tabla{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px} .salud-tabla td{padding:5px 6px 5px 0;border-top:1px solid var(--linea);vertical-align:top} .salud-tabla td:last-child{text-align:right;color:var(--suave)}
.medidor{height:8px;border-radius:9px;background:var(--tarjeta-2);overflow:hidden;margin-top:6px} .medidor i{display:block;height:100%;background:var(--porthos)} .medidor i.cerca{background:var(--bataka)} .medidor i.pasado{background:var(--torote)}
.salud-sec{margin-top:14px} .salud-sec h4{margin:0 0 2px;font-size:14px;font-weight:800}
.salud-in{flex:1;min-width:0;border-radius:10px;border:1px solid var(--linea);background:var(--tarjeta-2);padding:10px;font-size:15px;color:var(--texto)}
.salud-in.corto{flex:0 0 96px}
</style>
</head>
<body>
<div class="franja"></div>
<div id="vLogin" class="login oculto">
  <h1>Oficina CW</h1>
  <input id="lEmail" type="email" placeholder="Correo" autocomplete="username">
  <input id="lClave" type="password" placeholder="Contraseña" autocomplete="current-password">
  <button id="lEntrar" class="btn pri">Entrar</button>
  <div id="lAviso" class="aviso"></div>
</div>

<div id="vApp" class="app oculto">
  <header>
    <h1 id="titulo">Para ti</h1>
    <button class="rec" id="btnRecargar" aria-label="Actualizar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>
  </header>
  <div class="agentes oculto" id="filaAgentes"></div>
  <main id="cuerpo"></main>
  <div id="pieChat" class="oculto">
    <div class="atajos" id="atajos"></div>
    <div class="entrada">
      <textarea id="txt" rows="1" placeholder="Escríbele al CEO…"></textarea>
      <button id="btnEnviar" aria-label="Enviar"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 20.5 21 12 3 3.5l.01 6.6L15 12 3.01 13.9z"/></svg></button>
    </div>
  </div>
  <nav>
    <button data-tab="para" class="activo">Para ti <span class="num oculto" id="numDec"></span></button>
    <button data-tab="wa">WhatsApp <span class="num oculto" id="numWa"></span></button>
    <button data-tab="chat">Chat</button>
    <button data-tab="cli">Clientes</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
const SUPABASE_URL = "https://jlyrymgbykhpktabvlkl.supabase.co";
const SUPABASE_KEY = "sb_publishable_ap5wyI1Q4-_IO8fXJ3xBJA_RzGp89dV"; // clave pública; los datos los protege RLS y el inicio de sesión
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "cw-oficina-movil" } });

const AGENTES = [["ceo", "CEO"], ["marketing", "Marketing"], ["comercial", "Comercial"], ["analista", "Analista"], ["finanzas", "Finanzas"], ["produccion", "Producción"], ["vinculo", "Ejecutivo"], ["guardia", "Guardia"], ["innovacion", "I+D"]];
const NOMBRES = { ...Object.fromEntries(AGENTES), community: "Community manager" };
const BITACORAS = { ceo: "1R0ygB6zftVJoVuU_nyHAG099vJOdqDJd-LmoXB1sJJo", marketing: "18KuHDoea5ImPXvHidv8tj18T4jcTM1i-Zu1o8wWknQs", analista: "1V0RP6TrCgd4jwSdB6G8vLO-KFslGkUBiZuIjuZU74eI",
  comercial: "1fTtM3WwLs3zol-1zii_RtP1Lyxoj068sEnJx1j8lWLM", finanzas: "1NW6CDOdTLrVGIQC7aCSH0qs6L6_qpXcqRLRlYuGs3RI", produccion: "1EwBYvQ_GnUOiQ6R-liEdUOb8TL2sM-P9ql8bBsjqgIg",
  vinculo: "19uO_d1xUV1xgJ3DGakcteqb_0r65LJ0Di5CMj5rP9sk", innovacion: "1hoCFleDoXoySVWvkDw3YKAKo8sf_ODYvAV2VQIvWNek", guardia: "1vkMXaGwwrE0AwhGt5lgRvx9cZMxiW7lURudTdxo9lng" };
const ATAJOS = { ceo: ["¿Qué necesitas de mí hoy?", "Resumen del día", "¿Cómo van las ventas?"] };
const URG_ORDEN = { hoy: 0, esta_semana: 1, puede_esperar: 2 };
// Cada pedido toma el color de la marca de la que habla.
const MARCAS = [
  [/bata[kc]|takataka|taká/i, "BaTaKá", "var(--bataka)"],
  [/torote/i, "TOROTE", "var(--torote)"],
  [/porthos/i, "PORTHOS", "var(--porthos)"],
  [/[uü]inky|jab[oó]n/i, "ÜINKY", "var(--uinky)"],
];
function marcaDe(t) {
  const txt = `${t.asunto} ${t.tarjeta?.resumen ?? ""} ${t.tarjeta?.hecho ?? ""} ${String(t.contenido ?? "").slice(0, 400)}`;
  for (const [rx, nombre, color] of MARCAS) if (rx.test(txt)) return { nombre, color };
  return { nombre: "Creative Whisper", color: "var(--cw-2)" };
}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const sinMarcas = (x) => String(x ?? "").replace(/\n*\[(auto|ig):[^\]]+\]/g, "");
const hora = (iso) => { try { return new Date(iso).toLocaleString("es-EC", { timeZone: "America/Guayaquil", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
const formato = (t) => esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/^#{1,3}\s*(.+)$/gm, "<b>$1</b>");
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3000); }
function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
function leer(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }

let tab = "para", agente = leer("cw-agente", "ceo"), pend = [], hechos = [], enviando = false, waChat = null, waAvisos = 0;

async function llamarOficina(cuerpo) {
  const { data } = await sb.auth.getSession();
  const r = await fetch(SUPABASE_URL + "/functions/v1/oficina", { method: "POST",
    headers: { "content-type": "application/json", apikey: SUPABASE_KEY, authorization: "Bearer " + (data?.session?.access_token ?? "") }, body: JSON.stringify(cuerpo) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

// ---------- Para ti: lo que te necesita y lo terminado ----------
const fechaHecho = (t) => [...String(t.historial || t.contenido || "").matchAll(/Avance de \w+ \((\d{4}-\d{2}-\d{2})\): hecho/g)].pop()?.[1] ?? "";
async function cargarPara() {
  const desde = new Date(Date.now() - 21 * 86400000).toISOString();
  const [a, b] = await Promise.all([
    sb.from("tablero_agentes").select("id,de_agente,asunto,contenido,historial,estado,tipo,tarjeta,creado_en").eq("para_agente", "matias").eq("estado", "requiere_aprobacion").order("creado_en", { ascending: true }).limit(60),

function reducirImagen(file) {
  return new Promise((ok, mal) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 2160 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.9)); };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error("no es una imagen")); };
    img.src = url;
  });
}

      if (ident.length < 4) { toast("Escribe el teléfono, el usuario o la sesión"); b.disabled = false; return; }
      const v = await llamarOp({ accion: "borrar_persona", empresa_id: id, identificador: ident });
      const resumen = `${v.mensajes} mensajes, ${v.conversaciones} conversaciones, ${v.interesados} registros de interesado, ${v.opiniones} opiniones; ${v.casos_sin_datos} casos quedan sin sus datos y se borran ${v.fotos} fotos`;
      if (!v.sesiones && !v.contactos_de_alertas) d.textContent = "No se encontró nada de esa persona en esta cuenta.";
      else if (confirm(`Se va a borrar: ${resumen}. No se puede deshacer. ¿Borrar?`)) { await llamarOp({ accion: "borrar_persona", empresa_id: id, identificador: ident, aplicar: true }); d.textContent = "Borrado: " + resumen + ". Quedó la constancia."; }
    }
    if (a === "simular") { const r = await llamarOp({ accion: "conservacion", simular: true }); toast(`Hoy se borrarían ${r.totales.mensajes} mensajes y ${r.totales.casos} casos`); await pintarPrivacidad(); }
    if (a === "modo") { if (b.dataset.modo !== "aplicar" || confirm("Desde mañana se borra todos los días lo que pasó su plazo de conservación. No se puede deshacer. ¿Empezar?")) { await llamarOp({ accion: "conservacion_modo", modo: b.dataset.modo }); await pintarPrivacidad(); } }
    if (a === "muestra") { const r = await llamarCal({ accion: "muestra" }); toast(`Muestra: ${r.total} mensajes (${r.agregados} nuevos; faltan ${r.faltan} para 300)`); await pintarCalidad(); }
    if (a === "reclasificar") { const r = await llamarCal({ accion: "reclasificar", limite: 40 }); toast(`${r.reclasificados} reclasificados; faltan ${r.faltan}`); await pintarCalidad(); }
    if (a === "etiquetador") { const n = $("#etqNombre").value.trim(); if (!n) { toast("Escribe el nombre"); b.disabled = false; return; } const r = await llamarCal({ accion: "enlace", nombre: n }); enlaceNuevo($("#etqEnlace"), "Enlace de etiquetado de " + r.nombre, r.enlace, r.vence, `Hola. Con este enlace etiquetas los mensajes desde el celular (unas 2 horas en total, se puede por partes): ${r.enlace}`); }
  } catch (x) { toast("No se pudo: " + x.message); }
  b.disabled = false;
});
$("#cuerpo").addEventListener("change", async (e) => {
  const c = e.target.closest("input[data-rep]"); if (!c || tab !== "cli") return;
  try { await llamarOp({ accion: "reporte_ajustes", empresa_id: c.dataset.rep, [c.dataset.clave]: c.checked }); toast("Guardado"); } catch (x) { toast("No se pudo: " + x.message); c.checked = !c.checked; }
}, true);
$("#cuerpo").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "guardiaTxt") document.querySelector('[data-salud-accion="guardia"]')?.click(); });

// ---------- Navegación ----------
function contador() {
  const n = pend.length; $("#numDec").textContent = n; $("#numDec").classList.toggle("oculto", !n);
  $("#numWa").textContent = waAvisos; $("#numWa").classList.toggle("oculto", !waAvisos);
}
async function cargarAvisosWa() { const { data } = await sb.from("avisos").select("telefono").eq("resuelto", false); waAvisos = new Set((data ?? []).map((x) => x.telefono)).size; }
async function cargarContadores() { try { await Promise.all([cargarPara(), cargarAvisosWa()]); contador(); } catch (e) { /* sin red */ } }
async function irA(t) {
  tab = t;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("activo", b.dataset.tab === t));
  $("#pieChat").classList.toggle("oculto", !(t === "chat" || (t === "wa" && waChat)));
  $("#atajos").classList.toggle("oculto", t !== "chat");
  $("#filaAgentes").classList.toggle("oculto", t !== "chat");
  $("#titulo").textContent = t === "chat" ? "Chat" : t === "wa" ? "WhatsApp" : t === "cli" ? "Clientes" : "Para ti";
  try {
    if (t === "chat") await pintarChat();
    else if (t === "wa") { if (!waChat) $("#cuerpo").innerHTML = `<div class="vacio">Cargando…</div>`; await pintarWa(); }
    else if (t === "cli") { $("#cuerpo").innerHTML = `<div class="vacio">Cargando…</div>`; await pintarClientes(); }
    else { $("#cuerpo").innerHTML = `<div class="vacio">Cargando…</div>`; await cargarPara(); contador(); pintarPara(); }
  } catch (e) { $("#cuerpo").innerHTML = `<div class="vacio">No pude cargar: ${esc(e.message)}</div>`; }
}

async function entrar() {
  const { data } = await sb.auth.getSession();
  if (!data?.session) { $("#vLogin").classList.remove("oculto"); $("#vApp").classList.add("oculto"); return; }
  const { data: admin } = await sb.rpc("es_admin");
  if (admin !== true) { $("#lAviso").textContent = "Esta cuenta no tiene acceso a la oficina."; await sb.auth.signOut(); $("#vLogin").classList.remove("oculto"); return; }
  $("#vLogin").classList.add("oculto"); $("#vApp").classList.remove("oculto");
  await irA("para");
  cargarAvisosWa().then(contador, () => {});
}

$("#lEntrar").addEventListener("click", async () => {
  $("#lAviso").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("#lEmail").value.trim(), password: $("#lClave").value });
  if (error) { $("#lAviso").textContent = "No pude entrar: " + error.message; return; }
  entrar();
});
$("#lClave").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#lEntrar").click(); });
document.querySelector("nav").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) irA(b.dataset.tab); });
$("#filaAgentes").addEventListener("click", (e) => { const b = e.target.closest("button[data-ag]"); if (!b) return; agente = b.dataset.ag; guardar("cw-agente", agente); pintarChat(); });
$("#btnRecargar").addEventListener("click", () => irA(tab));
$("#btnEnviar").addEventListener("click", () => enviar());
$("#txt").addEventListener("input", ajustarTxt);
$("#atajos").addEventListener("click", (e) => { const b = e.target.closest("button[data-atajo]"); if (b) enviar(b.dataset.atajo); });
$("#cuerpo").addEventListener("change", (e) => { const i = e.target.closest(".aj-archivo input"); if (i) i.closest(".card").querySelector(".aj-nom").textContent = i.files?.[0] ? "📎 " + i.files[0].name : ""; });
$("#cuerpo").addEventListener("click", async (e) => {
  const so = e.target.closest("button[data-sol]"); if (so) return decidirSolicitud(so);
  const sl = e.target.closest("button[data-sol-listo]"); if (sl) return solicitudFuera(Number(sl.dataset.solListo));
  const cs = tab !== "cli" && e.target.closest("[data-sol-hecho] [data-copiar]"); if (cs) { try { await navigator.clipboard.writeText(cs.dataset.copiar); toast("Mensaje copiado"); } catch (x) { toast("No se pudo copiar: selecciónalo a mano"); } return; }
  const b = e.target.closest("button[data-dec]"); if (b) return decidir(b);
  const aj = e.target.closest("button[data-aj]"); if (aj) return ajustarPost(aj);
  const f = e.target.closest("button[data-tel]"); if (f) { waChat = f.dataset.tel; return irA("wa"); }
  if (e.target.closest("button[data-volver]")) { waChat = null; return irA("wa"); }
  if (e.target.closest("button[data-reanudar]")) {
    try { await llamarBot({ accion: "reanudar_bot", telefono: waChat }); toast("El bot vuelve a responder este chat"); } catch (x) { toast("No pude: " + x.message); }
    return pintarWa(false);
  }
  const r = e.target.closest("button[data-resuelto]");
  if (r) { await sb.from("avisos").update({ resuelto: true }).eq("id", Number(r.dataset.resuelto)); await pintarWa(false); }
});
$("#cuerpo").addEventListener("input", (e) => {
  const c = e.target.closest("textarea.com"); if (!c) return;
  const b = c.closest(".card")?.querySelector("button[data-vacio]"); if (b) b.textContent = c.value.trim() ? b.dataset.lleno : b.dataset.vacio;
  c.style.height = "auto"; c.style.height = Math.min(220, c.scrollHeight) + "px";
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("#vApp").classList.contains("oculto")) { if (tab === "para") irA("para"); else if (tab === "wa") { if (!enviando) pintarWa(false); } else if (tab === "cli") pintarClientes().catch(() => {}); else if (!enviando) pintarChat(false); cargarContadores(); } });
entrar();
</script>
</body>
</html>
