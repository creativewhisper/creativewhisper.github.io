<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oficina CW">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/monograma-cw.png">
<link rel="apple-touch-icon" href="icono-180.png">
<title>Oficina CW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#0A0908;--ink-2:#12100E;--ink-3:#1B1815;--ink-4:#24201C;
  --bone:#ECE6DB;--mute:#9A9185;--mute-2:#6B6358;
  --metal:#CDBFA6;--metal-deep:#857A69;
  --line:rgba(236,230,219,.12);
  --rec:#D9412B;--ok:#8FB08A;--warn:#D9A84B;--blue:#8FA9D9;
  --f-caps:"Cinzel",Georgia,serif;
  --f-body:"Hanken Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--metal)}
.oculto{display:none!important}
.app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto}
header{padding:calc(10px + var(--safe-t)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--ink-2)}
header .marca{font-family:var(--f-caps);letter-spacing:.2em;font-size:12px;color:var(--metal);text-transform:uppercase;flex:1;min-width:0}
header select{background:var(--ink-3);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:14px}
header .rec{width:34px;height:34px;border-radius:10px;background:var(--ink-3);border:1px solid var(--line);display:grid;place-items:center}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 16px}
nav{display:flex;border-top:1px solid var(--line);background:var(--ink-2);padding-bottom:var(--safe-b)}
nav button{flex:1;padding:10px 4px 12px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button svg{width:22px;height:22px}
nav button.activo{color:var(--bone)}
nav .num{position:absolute;top:5px;left:calc(50% + 6px);background:var(--rec);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;font-weight:600}
/* Chat */
.msgs{display:flex;flex-direction:column;gap:8px}
.burbuja{max-width:86%;padding:9px 12px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.burbuja.yo{align-self:flex-end;background:#3A3226;border-bottom-right-radius:5px}
.burbuja.ag{align-self:flex-start;background:var(--ink-3);border:1px solid var(--line);border-bottom-left-radius:5px}
.burbuja .hora{display:block;font-size:11px;color:var(--mute-2);margin-top:4px}
.escribiendo{color:var(--mute);font-style:italic}
.atajos{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 0;scrollbar-width:none}
.atajos button{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--metal);background:var(--ink-2)}
.entrada{display:flex;gap:8px;align-items:flex-end;padding:8px 16px 10px;background:var(--ink)}
.entrada textarea{flex:1;resize:none;max-height:140px;min-height:42px;border-radius:21px;border:1px solid var(--line);background:var(--ink-3);padding:10px 14px;font-size:16px;line-height:1.3}
.entrada button{width:42px;height:42px;border-radius:50%;background:var(--metal);color:var(--ink);display:grid;place-items:center;flex:0 0 auto}
.entrada button:disabled{opacity:.4}
/* Tarjetas */
h2{font-family:var(--f-caps);font-weight:500;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--metal);margin:6px 0 4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:10px}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card .tit{font-weight:600;font-size:15px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--ink-4);color:var(--bone)}
.chip.aprobar{background:rgba(143,176,138,.18);color:var(--ok)}
.chip.rechazar,.chip.hoy{background:rgba(217,65,43,.18);color:#F08A78}
.chip.tu_decides{background:rgba(217,168,75,.18);color:var(--warn)}
.chip.hacer{background:rgba(143,169,217,.18);color:var(--blue)}
.por{color:var(--mute);font-size:13.5px}
.paso{margin-top:6px;font-size:14px}
details{margin-top:8px}
summary{color:var(--metal);font-size:13px;cursor:pointer}
.largo{white-space:pre-wrap;font-size:13px;color:var(--mute);margin-top:6px;max-height:280px;overflow:auto}
.card textarea{width:100%;margin-top:8px;border-radius:10px;border:1px solid var(--line);background:var(--ink-3);padding:8px 10px;font-size:15px;resize:vertical}
.acciones{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:14px}
.btn.pri{background:var(--metal);color:var(--ink);border-color:var(--metal)}
.btn:disabled{opacity:.5}
.vacio{color:var(--mute);font-style:italic;padding:10px 0}
/* Login */
.login{max-width:360px;margin:12vh auto 0;padding:0 16px}
.login h1{font-family:var(--f-caps);font-weight:500;letter-spacing:.2em;font-size:16px;color:var(--metal);text-transform:uppercase;margin:0 0 18px}
.login input{width:100%;margin-bottom:10px;border-radius:10px;border:1px solid var(--line);background:var(--ink-3);padding:12px;font-size:16px}
.login .btn{width:100%}
.aviso{color:#F08A78;font-size:13px;min-height:18px;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));background:var(--bone);color:var(--ink);padding:9px 14px;border-radius:10px;font-size:14px;max-width:90%;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="vLogin" class="login oculto">
  <h1>Oficina CW</h1>
  <input id="lEmail" type="email" placeholder="Correo" autocomplete="username">
  <input id="lClave" type="password" placeholder="Contraseña" autocomplete="current-password">
  <button id="lEntrar" class="btn pri">Entrar</button>
  <div id="lAviso" class="aviso"></div>
</div>

<div id="vApp" class="app oculto">
  <header>
    <div class="marca" id="titulo">Oficina CW</div>
    <select id="selAgente" aria-label="Con quién hablas"></select>
    <button class="rec" id="btnRecargar" aria-label="Actualizar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>
  </header>
  <main id="cuerpo"></main>
  <div id="pieChat">
    <div class="atajos" id="atajos"></div>
    <div class="entrada">
      <textarea id="txt" rows="1" placeholder="Mensaje para el CEO…"></textarea>
      <button id="btnEnviar" aria-label="Enviar"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 20.5 21 12 3 3.5l.01 6.6L15 12 3.01 13.9z"/></svg></button>
    </div>
  </div>
  <nav>
    <button data-tab="chat" class="activo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Chat</button>
    <button data-tab="decisiones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Te necesitan<span class="num oculto" id="numDec"></span></button>
    <button data-tab="terminado"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15l2 2 4-4"/></svg>Terminado</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const SUPABASE_URL = "https://jlyrymgbykhpktabvlkl.supabase.co";
const SUPABASE_KEY = "sb_publishable_ap5wyI1Q4-_IO8fXJ3xBJA_RzGp89dV"; // clave pública; los datos los protege RLS y el inicio de sesión
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "cw-oficina-movil" } });

const AGENTES = [["ceo", "CEO"], ["marketing", "Marketing"], ["comercial", "Comercial"], ["analista", "Analista"], ["finanzas", "Finanzas"], ["produccion", "Producción"], ["vinculo", "Ejecutivo de cuenta"], ["guardia", "Guardia"], ["innovacion", "I+D"]];
const NOMBRES = Object.fromEntries(AGENTES);
const BITACORAS = { ceo: "1R0ygB6zftVJoVuU_nyHAG099vJOdqDJd-LmoXB1sJJo", marketing: "18KuHDoea5ImPXvHidv8tj18T4jcTM1i-Zu1o8wWknQs", analista: "1V0RP6TrCgd4jwSdB6G8vLO-KFslGkUBiZuIjuZU74eI",
  comercial: "1fTtM3WwLs3zol-1zii_RtP1Lyxoj068sEnJx1j8lWLM", finanzas: "1NW6CDOdTLrVGIQC7aCSH0qs6L6_qpXcqRLRlYuGs3RI", produccion: "1EwBYvQ_GnUOiQ6R-liEdUOb8TL2sM-P9ql8bBsjqgIg",
  vinculo: "19uO_d1xUV1xgJ3DGakcteqb_0r65LJ0Di5CMj5rP9sk", innovacion: "1hoCFleDoXoySVWvkDw3YKAKo8sf_ODYvAV2VQIvWNek", guardia: "1vkMXaGwwrE0AwhGt5lgRvx9cZMxiW7lURudTdxo9lng" };
const ATAJOS = { ceo: ["¿Qué necesitas de mí hoy?", "Resumen del día en 5 líneas", "¿Cómo van las ventas esta semana?", "¿Qué terminó el equipo?"],
  marketing: ["¿Qué sale esta semana?", "Ideas para Navidad"], comercial: ["¿Cuántos pedidos hubo esta semana?"], finanzas: ["¿Cuánto vendimos este mes?"] };
const REC_TXT = { aprobar: "Te recomiendo aprobar", rechazar: "Te recomiendo rechazar", tu_decides: "Tú decides", hacer: "Te toca hacerlo" };
const URG_TXT = { hoy: "Hoy", esta_semana: "Esta semana", puede_esperar: "Puede esperar" };
const URG_ORDEN = { hoy: 0, esta_semana: 1, puede_esperar: 2 };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const sinMarcas = (x) => String(x ?? "").replace(/\n*\[auto:[^\]]+\]/g, "");
const hora = (iso) => { try { return new Date(iso).toLocaleString("es-EC", { timeZone: "America/Guayaquil", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
// Formato mínimo para las respuestas: negritas y viñetas, sin HTML del modelo.
const formato = (t) => esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/^#{1,3}\s*(.+)$/gm, "<b>$1</b>");
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }
function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
function leer(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }

let tab = "chat", agente = leer("cw-agente", "ceo"), pend = [], hechos = [], enviando = false;

async function llamarOficina(cuerpo) {
  const { data } = await sb.auth.getSession();
  const r = await fetch(SUPABASE_URL + "/functions/v1/oficina", { method: "POST",
    headers: { "content-type": "application/json", apikey: SUPABASE_KEY, authorization: "Bearer " + (data?.session?.access_token ?? "") }, body: JSON.stringify(cuerpo) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

// ---------- Chat ----------
async function pintarChat(abajo = true) {
  const { data, error } = await sb.from("conversaciones_agentes").select("rol,contenido,creado_en").eq("agente", agente).order("creado_en", { ascending: false }).limit(40);
  if (error) { $("#cuerpo").innerHTML = `<div class="vacio">No pude leer el chat: ${esc(error.message)}</div>`; return; }
  const msgs = (data ?? []).reverse();
  $("#cuerpo").innerHTML = `<div class="msgs">` + (msgs.length ? msgs.map((m) => `<div class="burbuja ${m.rol === "matias" ? "yo" : "ag"}">${m.rol === "matias" ? esc(m.contenido) : formato(m.contenido)}<span class="hora">${esc(hora(m.creado_en))}</span></div>`).join("")
    : `<div class="vacio">Escríbele a ${esc(NOMBRES[agente])}. Responde con los datos en vivo de la oficina.</div>`) + (enviando ? `<div class="burbuja ag escribiendo">${esc(NOMBRES[agente])} está pensando…</div>` : "") + `</div>`;
  $("#atajos").innerHTML = (ATAJOS[agente] ?? []).map((a) => `<button data-atajo="${esc(a)}">${esc(a)}</button>`).join("");
  $("#txt").placeholder = `Mensaje para ${agente === "ceo" ? "el CEO" : NOMBRES[agente]}…`;
  if (abajo) requestAnimationFrame(() => { $("#cuerpo").scrollTop = $("#cuerpo").scrollHeight; });
}
async function enviar(texto) {
  texto = (texto ?? $("#txt").value).trim();
  if (!texto || enviando) return;
  enviando = true; $("#btnEnviar").disabled = true; $("#txt").value = ""; ajustarTxt();
  const caja = $("#cuerpo .msgs");
  if (caja) { caja.querySelector(".vacio")?.remove(); caja.insertAdjacentHTML("beforeend", `<div class="burbuja yo">${esc(texto)}</div><div class="burbuja ag escribiendo">${esc(NOMBRES[agente])} está pensando… (puede tardar hasta un minuto)</div>`); $("#cuerpo").scrollTop = $("#cuerpo").scrollHeight; }
  try { await llamarOficina({ accion: "chat", agente, mensaje: texto }); }
  catch (e) { toast("No llegó la respuesta: " + e.message); }
  enviando = false; $("#btnEnviar").disabled = false;
  if (tab === "chat") await pintarChat();
  cargarContadores();
}
function ajustarTxt() { const t = $("#txt"); t.style.height = "auto"; t.style.height = Math.min(140, t.scrollHeight) + "px"; }

// ---------- Lo que necesita a Matías ----------
async function cargarDecisiones() {
  const { data, error } = await sb.from("tablero_agentes").select("id,de_agente,asunto,contenido,historial,estado,tipo,tarjeta,creado_en").eq("para_agente", "matias").eq("estado", "requiere_aprobacion").order("creado_en", { ascending: true }).limit(60);
  if (error) throw error;
  pend = (data ?? []).sort((a, b) => (URG_ORDEN[a.tarjeta?.urgencia] ?? 3) - (URG_ORDEN[b.tarjeta?.urgencia] ?? 3));
}
function pintarDecisiones() {
  const n = (u) => pend.filter((t) => t.tarjeta?.urgencia === u).length;
  const cab = [n("hoy") && `${n("hoy")} para hoy`, n("esta_semana") && `${n("esta_semana")} esta semana`, n("puede_esperar") && `${n("puede_esperar")} pueden esperar`].filter(Boolean).join(" · ");
  $("#cuerpo").innerHTML = `<div class="sub">${pend.length ? esc(cab || `${pend.length} pendientes`) : "Nada pendiente. Todo bajo control."}</div>` + pend.map((t) => {
    const k = t.tarjeta?.tipo === "decision" ? t.tarjeta : null, necesito = /^Te necesito:/.test(t.asunto);
    return `<div class="card" data-id="${t.id}"><div class="tit">${esc(k?.resumen || t.asunto)}</div>
      ${k ? `<div class="chips"><span class="chip ${esc(k.recomendacion)}">${esc(REC_TXT[k.recomendacion] ?? k.recomendacion)}</span>${k.costo ? `<span class="chip">${esc(k.costo)}</span>` : ""}<span class="chip ${k.urgencia === "hoy" ? "hoy" : ""}">${esc(URG_TXT[k.urgencia] ?? "")}</span></div>` : ""}
      ${k?.por_que ? `<div class="por">${esc(k.por_que)}</div>` : ""}${k?.paso ? `<div class="paso">👉 ${esc(k.paso)}</div>` : ""}
      <details><summary>Ver detalle · ${esc(NOMBRES[t.de_agente] ?? t.de_agente)} · #${t.id}</summary><div class="largo">${esc(t.asunto)}\n\n${esc(sinMarcas(t.historial || t.contenido))}</div>
        <textarea rows="2" class="com" placeholder="Ajuste o comentario para el equipo (opcional)"></textarea></details>
      <div class="acciones">${necesito ? `<button class="btn pri" data-dec="aprobado">Ya lo hice</button><button class="btn" data-dec="rechazado">Ahora no</button>`
        : `<button class="btn pri" data-dec="aprobado">Aprobar</button><button class="btn" data-dec="rechazado">Rechazar</button>`}</div></div>`;
  }).join("");
}
async function decidir(boton) {
  const card = boton.closest(".card"), id = Number(card.dataset.id), nuevo = boton.dataset.dec;
  const t = pend.find((x) => x.id === id), com = (card.querySelector(".com")?.value ?? "").trim();
  card.querySelectorAll("button").forEach((b) => (b.disabled = true));
  const cambios = { estado: nuevo };
  if (com && nuevo !== "aprobado") cambios.contenido = (t?.contenido ?? "") + `\n\n— Comentario de Matías al rechazar (${new Date().toISOString().slice(0, 10)}): ${com}`;
  const { error } = await sb.from("tablero_agentes").update(cambios).eq("id", id);
  if (error) { toast("No se pudo guardar: " + error.message); card.querySelectorAll("button").forEach((b) => (b.disabled = false)); return; }
  if (nuevo === "aprobado") {
    try {
      const x = await llamarOficina({ accion: "ejecutar_aprobado", id, comentario: com });
      toast(x.trabajan?.length ? `Listo. ${x.trabajan.map((a) => NOMBRES[a] ?? a).join(", ")} ya está trabajando` : "Listo");
    } catch (e) { toast("Guardado, pero no pude avisar al equipo: " + e.message); }
  } else toast(/^Te necesito:/.test(t?.asunto ?? "") ? "Pospuesto 7 días" : "Rechazado");
  pend = pend.filter((x) => x.id !== id);
  pintarDecisiones(); contador();
}

// ---------- Terminado ----------
const fechaHecho = (t) => [...String(t.contenido ?? "").matchAll(/Avance de \w+ \((\d{4}-\d{2}-\d{2})\): hecho/g)].pop()?.[1] ?? "";
async function cargarTerminado() {
  const desde = new Date(Date.now() - 21 * 86400000).toISOString();
  const { data, error } = await sb.from("tablero_agentes").select("id,de_agente,para_agente,asunto,contenido,historial,tarjeta,creado_en").eq("estado", "hecho").eq("tipo", "solicitud").gte("creado_en", desde).order("creado_en", { ascending: false }).limit(80);
  if (error) throw error;
  const lim = new Date(Date.now() - 14 * 86400000).toISOString().slice(0, 10);
  hechos = (data ?? []).filter((t) => fechaHecho(t) >= lim).sort((a, b) => fechaHecho(b).localeCompare(fechaHecho(a)));
}
function pintarTerminado() {
  $("#cuerpo").innerHTML = `<div class="sub">Últimas 2 semanas. El entregable completo está en la Bitácora de cada agente.</div>` + (hechos.length ? hechos.map((t) => {
    const k = t.tarjeta?.tipo === "resultado" ? t.tarjeta : null, quien = /^(ceo|matias)$/.test(t.para_agente) ? t.de_agente : t.para_agente, bit = BITACORAS[quien];
    return `<div class="card"><div class="tit">${esc(k?.hecho || t.asunto)}</div>
      <div class="chips"><span class="chip">${esc(NOMBRES[quien] ?? quien)}</span><span class="chip">${esc(fechaHecho(t))}</span>${k?.revisar ? `<span class="chip tu_decides">Revísalo</span>` : ""}</div>
      ${k?.resultado ? `<div class="por">${esc(k.resultado)}</div>` : ""}
      <div class="paso">📄 ${esc(k?.donde || `Bitácora de ${NOMBRES[quien] ?? quien}, Entregable #${t.id}`)}${bit ? ` · <a href="https://docs.google.com/document/d/${bit}/edit" target="_blank" rel="noopener">Abrir</a>` : ""}</div>
      <details><summary>Historial de la tarea #${t.id}</summary><div class="largo">${esc(sinMarcas(t.historial || t.contenido))}</div></details></div>`;
  }).join("") : `<div class="vacio">Todavía no hay trabajos terminados.</div>`);
}

// ---------- Navegación ----------
function contador() { const n = pend.length; $("#numDec").textContent = n; $("#numDec").classList.toggle("oculto", !n); }
async function cargarContadores() { try { await cargarDecisiones(); contador(); } catch (e) { /* sin red */ } }
async function irA(t) {
  tab = t;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("activo", b.dataset.tab === t));
  $("#pieChat").classList.toggle("oculto", t !== "chat");
  $("#selAgente").classList.toggle("oculto", t !== "chat");
  $("#titulo").textContent = t === "chat" ? "Oficina CW" : t === "decisiones" ? "Te necesitan" : "Terminado";
  try {
    if (t === "chat") await pintarChat();
    else if (t === "decisiones") { $("#cuerpo").innerHTML = `<div class="vacio">Cargando…</div>`; await cargarDecisiones(); contador(); pintarDecisiones(); }
    else { $("#cuerpo").innerHTML = `<div class="vacio">Cargando…</div>`; await cargarTerminado(); pintarTerminado(); }
  } catch (e) { $("#cuerpo").innerHTML = `<div class="vacio">No pude cargar: ${esc(e.message)}</div>`; }
}

async function entrar() {
  const { data } = await sb.auth.getSession();
  if (!data?.session) { $("#vLogin").classList.remove("oculto"); $("#vApp").classList.add("oculto"); return; }
  const { data: admin } = await sb.rpc("es_admin");
  if (admin !== true) { $("#lAviso").textContent = "Esta cuenta no tiene acceso a la oficina."; await sb.auth.signOut(); $("#vLogin").classList.remove("oculto"); return; }
  $("#vLogin").classList.add("oculto"); $("#vApp").classList.remove("oculto");
  $("#selAgente").innerHTML = AGENTES.map(([k, n]) => `<option value="${k}" ${k === agente ? "selected" : ""}>${esc(n)}</option>`).join("");
  await irA("chat"); cargarContadores();
}

$("#lEntrar").addEventListener("click", async () => {
  $("#lAviso").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("#lEmail").value.trim(), password: $("#lClave").value });
  if (error) { $("#lAviso").textContent = "No pude entrar: " + error.message; return; }
  entrar();
});
$("#lClave").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#lEntrar").click(); });
document.querySelector("nav").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) irA(b.dataset.tab); });
$("#selAgente").addEventListener("change", (e) => { agente = e.target.value; guardar("cw-agente", agente); pintarChat(); });
$("#btnRecargar").addEventListener("click", () => { irA(tab); cargarContadores(); });
$("#btnEnviar").addEventListener("click", () => enviar());
$("#txt").addEventListener("input", ajustarTxt);
$("#atajos").addEventListener("click", (e) => { const b = e.target.closest("button[data-atajo]"); if (b) enviar(b.dataset.atajo); });
$("#cuerpo").addEventListener("click", (e) => { const b = e.target.closest("button[data-dec]"); if (b) decidir(b); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("#vApp").classList.contains("oculto")) { cargarContadores(); if (tab === "chat" && !enviando) pintarChat(false); } });
entrar();
</script>
</body>
</html>
